---
- name: Read final package and running-kernel proof
  ansible.builtin.import_tasks: proof.yml

- name: Require every requested advisory to be fixed
  ansible.builtin.assert:
    that: sniper_proof.verified | bool
    fail_msg: "Fix verification failed: {{ sniper_proof | to_json }}"

- name: Read remaining reboot requirement
  ansible.builtin.command:
    argv: [needs-restarting, "-r"]
  register: sniper_pending_reboot
  changed_when: false
  failed_when: sniper_pending_reboot.rc not in [0, 1]
  check_mode: false

- name: Require no outstanding reboot
  ansible.builtin.assert:
    that: sniper_pending_reboot.rc == 0
    fail_msg: The fixed RPMs are installed but the system still requires a reboot.

- name: Run smoke tests
  ansible.builtin.import_tasks: smoke.yml

- name: Record proof completion for the final controller assertion
  ansible.builtin.set_fact:
    sniper_verified_id: '{{ hostvars["localhost"].sniper_id }}'
    sniper_verified_environment: "{{ sniper_environment }}"

- name: Report verified fix evidence
  ansible.builtin.debug:
    msg:
      requested: '{{ hostvars["localhost"].sniper_id }}'
      resolved_advisories: '{{ hostvars["localhost"].sniper_resolved_ids }}'
      environment: "{{ sniper_environment }}"
      proof: "{{ sniper_proof }}"
