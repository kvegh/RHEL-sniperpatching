name: Publish RHEL sniperpatching walkthrough

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/deploy-demo.yml'
  pull_request:
    paths:
      - 'demo/**'
      - '.github/workflows/deploy-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sniper-demo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check the public walkthrough
        run: |
          node --check demo/src/scenario.js
          node --check demo/src/app.js
          node --check demo/tests/live.cjs
          node --test demo/tests/*.test.cjs

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0
      # Publish only frontend assets; see demo/README.md#github-pages.
      - name: Prepare only the public walkthrough assets
        run: |
          mkdir -p "${RUNNER_TEMP}/sniper-demo/src"
          cp demo/index.html "${RUNNER_TEMP}/sniper-demo/"
          cp demo/src/scenario.js demo/src/app.js demo/src/styles.css "${RUNNER_TEMP}/sniper-demo/src/"
          touch "${RUNNER_TEMP}/sniper-demo/.nojekyll"
      - name: Upload the walkthrough
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/sniper-demo
          include-hidden-files: true
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
