---
- name: Require the NEW target's previously verified public SSH key
  ansible.builtin.assert:
    that:
      - ansible_host is defined
      - ansible_host is string
      - ansible_host is match('^[A-Za-z0-9_.-]+$')
      - sniper_ssh_host_key is defined
      - sniper_ssh_host_key is match('^(ssh-ed25519|ecdsa-sha2-nistp256|ssh-rsa) [A-Za-z0-9+/=]+$')
    fail_msg: Configure the exact NEW target and its management-verified SSH public key in protected CaC.
  no_log: true

- name: Create an execution-local public host-key pin file
  ansible.builtin.tempfile:
    state: file
    suffix: .sniper-known-hosts
  delegate_to: localhost
  become: false
  register: sniper_new_trust_file
  no_log: true
  changed_when: false
  check_mode: false

- name: Write only the verified target public key with private file permissions
  ansible.builtin.copy:
    content: "{{ ansible_host }} {{ sniper_ssh_host_key }}\n"
    dest: "{{ sniper_new_trust_file.path }}"
    mode: '0600'
  delegate_to: localhost
  become: false
  no_log: true
  changed_when: false
  check_mode: false

- name: Require the exact SSH pin without changing persistent trust
  ansible.builtin.set_fact:
    ansible_host_key_checking: true
    ansible_ssh_host_key_checking: true
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile={{ sniper_new_trust_file.path | quote }}
      -o GlobalKnownHostsFile=/dev/null
      -o UpdateHostKeys=no
  no_log: true
